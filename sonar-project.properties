# SonarCloud configuration — finish setup at https://sonarcloud.io/projects/create
# After importing the GitHub repo, replace the two placeholders below with the
# values shown in the SonarCloud onboarding wizard, then add SONAR_TOKEN to
# repo Settings → Secrets and variables → Actions.

sonar.projectKey=YOUR_ORG_ekopicker-vendor
sonar.organization=YOUR_ORG

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**
sonar.exclusions=**/__mocks__/**,**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.expo/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

sonar.sourceEncoding=UTF-8
